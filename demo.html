<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hairline graphics</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 14px/1.5 system-ui, sans-serif; background: #fff; color: #232327; }
  main { max-width: 560px; margin: 0 auto; }
  hairline-rack { width: 100%; }
  output { font: 12px ui-monospace, monospace; color: #6f6f78; }
</style>
</head>
<body>
<main>
  <hairline-rack id="rack"></hairline-rack>
  <output id="read">rest</output>
</main>
<script type="module">
  import "./dist/hairline.js";
  document.getElementById("rack").addEventListener("read", (e) => { document.getElementById("read").textContent = e.detail; });
</script>
</body>
</html>
